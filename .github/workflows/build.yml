name: build
run-name: "build ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    env:
      CHEZ_SCHEME_VERSION: '10.3.0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Chez cache
        id: shen-scheme-chez10-cache
        uses: actions/cache@v5
        with:
          path: _build/chez
          key: ${{ matrix.os }}-chez-${{ env.CHEZ_SCHEME_VERSION }}
      - name: Install deps (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev
        if: runner.os == 'Linux'
      - name: Build Chez
        run: make chez_kernel
      - name: Build and test
        run: |
          echo "Using Chez Scheme version ${{ env.CHEZ_SCHEME_VERSION }}"
          make fetch-kernel
          make fetch-prebuilt
          make precompile-with-prebuilt
          make csversion=${{ env.CHEZ_SCHEME_VERSION }}
          make test
      - name: Test clean parallel build
        run: make test-clean-parallel-build
      - name: Test runtime artifact recovery
        run: make test-runtime-artifact-recovery
      - name: Test external runtime modes
        if: runner.os == 'Linux'
        run: make test-external-runtime
